      - name: Test Netlify API access
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -sS \
            -o /tmp/netlify-project.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")

          echo "Netlify API status: $HTTP_CODE"

          case "$HTTP_CODE" in
            200)
              PROJECT_NAME=$(jq -r '.name' /tmp/netlify-project.json)
              echo "Token access confirmed for project: $PROJECT_NAME"
              ;;
            401)
              echo "::error::NETLIFY_AUTH_TOKEN is invalid, expired, or revoked."
              exit 1
              ;;
            403)
              echo "::error::The token has no permission for this Netlify team/project."
              exit 1
              ;;
            404)
              echo "::error::NETLIFY_SITE_ID is incorrect, or the token cannot see this project."
              exit 1
              ;;
            *)
              echo "::error::Unexpected Netlify API response: $HTTP_CODE"
              cat /tmp/netlify-project.json
              exit 1
              ;;
          esac
