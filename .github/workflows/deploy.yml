name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify website files
        shell: bash
        run: |
          test -f index.html || {
            echo "::error::index.html does not exist"
            exit 1
          }

      - name: Verify Netlify secrets
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo "::error::NETLIFY_AUTH_TOKEN is missing"
            exit 1
          }

          test -n "$NETLIFY_SITE_ID" || {
            echo "::error::NETLIFY_SITE_ID is missing"
            exit 1
          }

          echo "Netlify credentials are configured."

      - name: Install Netlify CLI
        run: npm install --no-save netlify-cli

      - name: Deploy to Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy \
            --dir="." \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
